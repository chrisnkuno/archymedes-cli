name: CLA
# Asks every outside contributor to sign CLA.md once (Part A, individual) by commenting on their PR.
# Signatures are stored in this repository, in signatures/cla.json on the `cla-signatures` branch.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# pull_request_target runs with the base repository's token; this job never checks out or runs
# the pull request's code, which is what makes that safe.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request && (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # TODO(supply-chain): pin by full commit SHA. No local copy of this action's SHA exists on the
      # machine this was written on, and a guessed SHA is worse than a tag. Resolve the commit for
      # tag v2.6.1 (`git ls-remote https://github.com/contributor-assistant/github-action v2.6.1`),
      # verify it on GitHub, and replace the ref below with `@<sha> # v2.6.1`.
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # Maintainers and bots who are covered otherwise (employment / entity agreement).
          allowlist: chrisnkuno,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for contributing to Friday. Before we can merge, please read the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            (draft, under counsel review) and sign it by commenting the sentence below. You keep
            ownership of your work. Commits still need a DCO `Signed-off-by` line (`git commit -s`).
