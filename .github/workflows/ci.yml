name: CLI release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bun install --frozen-lockfile
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os == 'Linux'
      - run: go test ./...
        if: runner.os != 'Linux'
      # Every published target compiles from one runner; the host one is also packed and installed below.
      - run: bun run build:go
        if: runner.os == 'Linux'
      - run: bun run typecheck
      - run: bun run test
        if: runner.os == 'Linux'
      - run: bun run build:packages
      - run: bun run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: archymedes-cli-${{ runner.os }}
          path: artifacts/
